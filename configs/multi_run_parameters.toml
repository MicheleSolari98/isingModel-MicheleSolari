[physics]
lattice_size = 40
coupling = 1.0

[simulation]
equilibration_cycles = 1300
measurement_cycles = 400
measurement_every = 10
seed = 5
repetitions = 3

[temperature_sweep]
start = 1.1
stop = 3.5
points = 12
include_critical_temperature = true

[output]
record_time_series = false
sample_every = 1
save_results = true